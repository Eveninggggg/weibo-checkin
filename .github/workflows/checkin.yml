name: 微博超话签到

# 定时策略说明：
#   GitHub Actions 的 cron 用 UTC 时间。下面配置了 3 个触发点（北京时间 09:07 / 10:23 / 11:41）。
#   北京时间 = UTC + 8。例如想 08:00 执行 → cron 写 '7 0 * * *'。
#
#   ⚠️ 为什么设 3 个触发点：
#     GitHub 的 schedule 是「尽力而为」，不保证准时。高负载时会延迟数小时，
#     甚至直接丢弃（无记录、无通知）。实测保活任务计划 11:17，实际 18:25 才跑。
#     因此一天设 3 次做容错 —— 脚本幂等（已签到的超话自动跳过），
#     且 MAIL_ALWAYS=0 时重复运行不会发多余邮件，多跑几次完全无害。
#
#   ⚠️ 为什么分钟位不是 0：
#     整点（:00）是全网 cron 最拥挤的时刻，延迟和丢弃概率最高，错开几分钟更可靠。
#
#   ⚠️ 重要：GitHub 会在「仓库 60 天无活动」时自动禁用定时工作流，且不通知。
#     注意「定时任务自己运行」不算活动，只有 commit 才算。
#     本项目用 .github/workflows/keepalive.yml 每周自动提交一次来规避，勿删该文件。
#
#   💡 最可靠的触发方式：配置外部准点触发（cron-job.org），
#     彻底绕开 GitHub 调度器。详见《部署指南.md》第三节。
#
# 邮件通知：
#   配置 SMTP_* 系列 Secrets 后，每次运行都会把「签到结果 + Cookie 倒计时」发到邮箱。
#   没配 SMTP 也能正常签到，只是不发邮件（日志里照样打印倒计时表）。
on:
  schedule:
    # ⚠️ GitHub 的 schedule 是「尽力而为」，高负载时会延迟数小时甚至直接丢弃。
    #    实测案例：保活任务计划 11:17 触发，实际 18:25 才跑（延迟 7 小时）。
    #    因此这里一天设 3 个触发点做容错——脚本幂等（已签到的超话自动跳过），
    #    且 MAIL_ALWAYS=0 时重复运行不会发多余邮件，多跑几次完全无害，
    #    哪一次先被调度到，哪一次就完成当天的签到。
    - cron: '7 1 * * *'      # 主：  北京 09:07
    # cron: '23 2 * * *'     # 备1： 北京 10:23
    # cron: '41 3 * * *'     # 备2： 北京 11:41

  # 【外部定时触发】用 cron-job.org 等外部服务准点唤起本工作流，
  # 彻底绕开 GitHub 自带调度器的延迟/丢单问题。详见《外部定时触发方案.md》。
  repository_dispatch:
    types: [checkin]          # 外部请求的 event_type 必须填 "checkin"

  workflow_dispatch:          # 支持在 Actions 网页上手动触发
    inputs:
      cookie_only:
        description: '只做 Cookie 体检（不发签到请求，仅发体检邮件）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_wait_minutes:
        description: '随机等待上限(分钟)。手动默认 0（立即执行）；定时默认 15；外部触发默认 5'
        required: false
        default: '0'
        type: string

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      # v5 起 actions/checkout 内部改用 Node 24，可消除 "Node.js 20 is deprecated" 警告
      - name: 拉取代码
        uses: actions/checkout@v5

      # 关于 npm 缓存：
      #   setup-node 的 cache: 'npm'（v5 里叫 package-manager-cache）需要仓库里存在
      #   package-lock.json，否则会报 "Dependencies lock file is not found" 并中断流程。
      #   本项目默认关闭缓存：依赖只有 playwright 一个，重复下载的耗时可以忽略，
      #   但能保证「只上传了源码、没上传锁文件」的情况也能一次跑通。
      #   若确认仓库根目录已有 package-lock.json，想加速可把下面改成 true。
      #
      # v5 相对 v4 的变化：package.json 里若有 packageManager 字段会「自动开启缓存」。
      #   为避免重新踩锁文件的坑，这里显式设为 false。
      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: 安装依赖
        run: npm install

      # Cookie 体检模式不需要浏览器，直接跳过下载，省时间
      - name: 安装 Chromium（Playwright 浏览器）
        if: ${{ github.event.inputs.cookie_only != 'true' }}
        run: npx playwright install --with-deps chromium

      # 随机窗口：在 0~N 分钟内随机等待，避免每次都在同一秒执行，降低机器特征。
      #   · GitHub 定时触发：上限默认 15 分钟（Secret WEIBO_MAX_WAIT_MINUTES 可调）
      #   · 外部触发：上限默认 5 分钟（Secret WEIBO_MAX_WAIT_MINUTES_EXTERNAL 可调）
      #   · 手动触发：上限取输入框 max_wait_minutes（默认 0，调试不等待）
      #   · 体检模式（cookie_only=true）：跳过等待
      #
      # 为什么默认窗口比较小（原来 60 分钟）：
      #   GitHub schedule 本身的调度延迟已有天然随机性，不必自己再等太久；
      #   且私有仓库 sleep 时间也计费，窗口越小越省额度。
      #
      # 注意：这个「随机等待」是任务级别的（决定整批账号几点开始），
      #       与「账号间隔 WEIBO_ACCOUNT_GAP_MS」是两回事，见下方执行签到步骤的注释。
      - name: 随机等待（时间窗）
        if: ${{ github.event.inputs.cookie_only != 'true' }}
        id: randwait
        run: |
          # 按触发来源决定等待上限（分钟）：
          #   schedule            → 15（GitHub 调度延迟本身已有随机性）
          #   repository_dispatch → 5（外部定时器很准时，留一点抖动即可）
          #   workflow_dispatch   → 输入框值，默认 0（手动调试不等待）
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MAX_MIN="${{ secrets.WEIBO_MAX_WAIT_MINUTES }}"
            [ -z "$MAX_MIN" ] && MAX_MIN=15
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            MAX_MIN="${{ secrets.WEIBO_MAX_WAIT_MINUTES_EXTERNAL }}"
            [ -z "$MAX_MIN" ] && MAX_MIN=5
          else
            MAX_MIN="${{ github.event.inputs.max_wait_minutes }}"
            [ -z "$MAX_MIN" ] && MAX_MIN=0
          fi

          MAX_SEC=$((MAX_MIN * 60))
          WAIT=$((RANDOM % (MAX_SEC + 1)))

          echo "触发方式：${{ github.event_name }}　等待上限：${MAX_MIN} 分钟"
          echo "本次随机等待 ${WAIT} 秒（约 $((WAIT / 60)) 分 $((WAIT % 60)) 秒）"
          echo "wait_seconds=${WAIT}" >> "$GITHUB_OUTPUT"

          if [ "$WAIT" -gt 0 ]; then
            sleep "$WAIT"
          fi
          echo "✅ 等待结束，开始执行签到"

      - name: 输出等待摘要
        if: ${{ always() && steps.randwait.outputs.wait_seconds != '' }}
        run: |
          echo "本次随机等待：${{ steps.randwait.outputs.wait_seconds }} 秒"

      - name: 执行签到（含 Cookie 到期检查与邮件通知）
        env:
          WEIBO_ACCOUNTS: ${{ secrets.WEIBO_ACCOUNTS }}
          WEIBO_KEYWORDS: ${{ secrets.WEIBO_KEYWORDS }}
          # ---- 防风控间隔（两个层级，别混淆）----
          #   WEIBO_TOPIC_GAP_MS   ：同一账号内，超话与超话之间的间隔
          #   WEIBO_ACCOUNT_GAP_MS ：账号与账号之间的间隔（模拟真人逐个操作，最关键）
          # 都留空则用代码默认值（4000 / 30000）。想关闭设为 0。
          WEIBO_TOPIC_GAP_MS: ${{ secrets.WEIBO_TOPIC_GAP_MS }}
          WEIBO_ACCOUNT_GAP_MS: ${{ secrets.WEIBO_ACCOUNT_GAP_MS }}
          # ---- 邮件通知（全部可选；不配置则自动跳过发信）----
          SMTP_HOST: ${{ secrets.SMTP_HOST }}          # 如 smtp.qq.com / smtp.163.com
          SMTP_PORT: ${{ secrets.SMTP_PORT }}          # 465(默认,SSL) 或 587
          SMTP_USER: ${{ secrets.SMTP_USER }}          # 发件邮箱
          SMTP_PASS: ${{ secrets.SMTP_PASS }}          # 邮箱 SMTP 授权码（非登录密码！）
          ALERT_TO: ${{ secrets.ALERT_TO }}            # 收件邮箱，多个用逗号分隔；留空=发给自己
          MAIL_ALWAYS: ${{ secrets.MAIL_ALWAYS }}      # 填 0 = 仅异常/预警时发信；留空 = 每天都发
          COOKIE_WARN_DAYS: ${{ secrets.COOKIE_WARN_DAYS }}  # 提前几天提醒，留空=7
        run: |
          if [ "${{ github.event.inputs.cookie_only }}" = "true" ]; then
            echo "→ Cookie 体检模式"
            node index.js --cookie-only
          else
            node index.js
          fi

      - name: 输出签到摘要
        if: always()
        run: |
          echo "### 微博超话签到" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 触发方式 | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 随机等待 | ${{ steps.randwait.outputs.wait_seconds || '0' }} 秒 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 账号间隔 | \`${{ secrets.WEIBO_ACCOUNT_GAP_MS || '30000' }}\` ms |" >> "$GITHUB_STEP_SUMMARY"
