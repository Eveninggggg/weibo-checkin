name: 微博超话签到

# 定时策略说明：
#   GitHub Actions 的 cron 用 UTC 时间。下面配置为每天 01:00 UTC 触发（= 北京时间 09:00）。
#   触发后工作流内会再「随机等待 0~60 分钟」，实现时间窗随机化，降低机器特征。
#   若要改时间：北京时间 = UTC + 8。例如想 08:00 执行 → cron 写 '0 0 * * *'（00:00 UTC）。
on:
  schedule:
    - cron: '0 1 * * *'      # 每天 01:00 UTC = 09:00 北京时间（触发点）
  workflow_dispatch:          # 支持手动触发（网页上点按钮即可测试）

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 安装 Chromium（Playwright 浏览器）
        run: npx playwright install --with-deps chromium

      # 随机窗口：在 0~60 分钟内随机等待，避免每天同一分钟执行
      - name: 随机等待（时间窗 0~60 分钟）
        run: |
          WAIT=$((RANDOM % 3600))
          echo "随机等待 ${WAIT} 秒（约 $((WAIT / 60)) 分钟）后执行签到"
          sleep $WAIT

      - name: 执行签到
        env:
          WEIBO_ACCOUNTS: ${{ secrets.WEIBO_ACCOUNTS }}
          WEIBO_KEYWORDS: ${{ secrets.WEIBO_KEYWORDS }}
          WEIBO_TOPIC_GAP_MS: '4000'
        run: node index.js
